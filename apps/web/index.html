<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the page language before anything else, so the browser does not offer to translate it.
      // The app takes over (and keeps it in sync) once it has loaded.
      // Mirrors initialLang()/matchLang() in src/i18n/index.tsx: keep the language list in sync with `languages`.
      (function () {
        var supported = ['es', 'eu', 'en', 'ca', 'gl', 'fr', 'de', 'it', 'pt', 'pl', 'cs', 'ru', 'nl', 'ja', 'ko', 'zh', 'zh-TW'];
        var lang = 'en';
        try {
          var saved = localStorage.getItem('lang');
          if (supported.indexOf(saved) !== -1) {
            lang = saved;
          } else {
            var t = (navigator.language || '').toLowerCase();
            if (t.indexOf('zh') === 0) lang = /^zh-(tw|hk|mo|hant)/.test(t) ? 'zh-TW' : 'zh';
            else if (supported.indexOf(t.slice(0, 2)) !== -1) lang = t.slice(0, 2);
          }
        } catch (e) {}
        document.documentElement.lang = lang;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1eb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Ink Hub" />
    <title>E-Ink Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
